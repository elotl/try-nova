---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: dra-gpu-test
  name: single-gpu
  labels:
    app: dra-test
spec:
  spec:
    devices:
      requests:
      - name: gpu
        firstAvailable:
        - name: l4
          deviceClassName: gpu.nvidia.com
          count: 1
          allocationMode: ExactCount
          selectors:
          - cel:
              expression: |
                device.attributes["gpu.nvidia.com"].productName == "NVIDIA L4"
        - name: t4
          deviceClassName: gpu.nvidia.com
          count: 1
          allocationMode: ExactCount
          selectors:
          - cel:
              expression: |
                device.attributes["gpu.nvidia.com"].productName == "Tesla T4"
---
apiVersion: v1
kind: Pod
metadata:
  namespace: dra-gpu-test
  name: pod
  labels:
    app: dra-test
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["nvidia-smi -L; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: claim-gpu
  resourceClaims:
  - name: claim-gpu
    resourceClaimTemplateName: single-gpu
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
