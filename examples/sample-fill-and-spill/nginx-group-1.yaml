apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-group-1
  namespace: default
  labels:
    groupingFeatureTest: "true"
    test: "test-group-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-group-1
  template:
    metadata:
      labels:
        app: nginx-group-1
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          resources:
            limits:
              cpu: "3"
            requests:
              cpu: "3"
